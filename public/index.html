<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Purchase Signature Test</title>
  <style>
    body {
      background-color: #111;
      color: #eee;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px;
    }
    input, button {
      margin: 6px;
      padding: 8px;
      border-radius: 5px;
      border: none;
    }
    input {
      width: 320px;
    }
    button {
      background: #444;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background: #666;
    }
    pre {
      background: #222;
      padding: 10px;
      border-radius: 8px;
      width: 90%;
      max-width: 600px;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <h2>🪶 Purchase Signature Generator</h2>

  <input type="text" id="userAddress" placeholder="Enter wallet address (0x...)" />
  <input type="number" id="nonce" placeholder="Enter nonce (e.g. 1)" />
  <button onclick="generateSignature()">Generate Signature</button>

  <h3>Response:</h3>
  <pre id="output">Waiting...</pre>

  <script>
    async function generateSignature() {
      const userAddress = document.getElementById('userAddress').value.trim();
      const nonce = document.getElementById('nonce').value.trim();
      const output = document.getElementById('output');

      if (!userAddress || !nonce) {
        output.textContent = "⚠️ Please enter both wallet address and nonce.";
        return;
      }

      output.textContent = "⏳ Sending request...";

      try {
        const response = await fetch('/api/purchaseSignature', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userAddress, nonce })
        });

        const data = await response.json();

        if (!response.ok) {
          output.textContent = `❌ Error: ${data.error || 'Unknown error'}`;
          return;
        }

        output.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        output.textContent = `🚨 Request failed: ${err.message}`;
      }
    }
  </script>
</body>
</html>
